[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factory-engine"
version = "0.1.0"
description = "Shared execution engine for Agent Factory workflows"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
]

[project.scripts]
factory-engine = "factory_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["factory_engine"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
